<H1>第二章：<BR>角色起源 Character Origins</H1>
<P>许多不同的族群都将艾泽拉斯视为自己的家园。其中一些原本就生活在这片土地上，另一些则从遥远的其他世界迁居至此。这些族群中的大多数都已加入联盟或部落。<BR>当你创建一名在艾泽拉斯冒险的角色时，首先从《玩家手册》中选择一个背景，然后从本章介绍的种族中选择一个。你所选择的种族还可能使你在艾泽拉斯的某个阵营中获得初始声望。有关这些阵营的详细信息，请参阅第四章。</P>
