<H2>  第一章</H2>
<H1>角色职业 Character Classes</H1>
<P>使用本书进行游戏时，创建角色的第一步便是选择职业。《魔兽世界》共有十三种职业，每种职业都包含多个职业专精。每个职业及其职业专精都对应着《玩家手册》中的特定特性选项，以及本书新增的选项。接下来几页中的三个边栏——“英雄职业”、“职业专精”以及“其他职业选项”——将提供更多一般性说明。</P>
