<H2>鲨华鱼人 Sahuagin</H2>
<P>

鲨华鱼人统治着雷霆海，出于他们的傲慢和掠夺性，鲨华鱼人认为地表生物是原始和懦弱的，它们通常会忽视栖息在海洋中的弱小生物，但当水中有血时，他们便会化作不依不饶且手段致命的敌人。通过魔法繁殖和诱导突变，他们创造出了一系列恐怖的生物，例如狡诈的马伦蒂，四臂的鲨华男爵，拟态质粒，当然还有最恐怖的沙阿贡之爪。
