<H2>妖精统治者 Fey Rulers</H2>
<P>妖精源自瑟兰尼斯。他们中最微渺的那些，便是所我们希望在世上看到的魔法化身——对树木与风中寄宿着精魂的遐想，以及顽皮的小仙灵与半羊人在林间空地上翩然起舞的景象。最强大的那些则是至高妖精，即那些统治着瑟兰尼斯各个领域、属于故事中的不灭者。本节将介绍其中的两位统治者：森林女王与遗忘王子。</P>
