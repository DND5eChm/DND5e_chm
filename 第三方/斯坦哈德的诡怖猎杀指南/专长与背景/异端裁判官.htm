<H3>异端裁判官 Inquisitor</H3>
<P>你是光辉将会坚定不移的门徒，你心中毫不动摇的信仰与神圣热忱，驱使你陈处任何威胁教会及其教义的事物。你的职责包括审问潜在的异端，调查教会内部的腐化迹象，或与信仰之敌作战。你行走在细线上，执行教会的律法，确保其信众的春节。</P>
<P><STRONG>属性值：</STRONG>力量，感知，魅力<BR><STRONG>专长：</STRONG>虔信<BR><STRONG>技能熟练：</STRONG>宗教和威吓<BR><STRONG>工具熟练：</STRONG>酷刑工具<BR><STRONG>装备：</STRONG>选择A或B：（A）书籍（祈祷书），圣徽，镣铐，旅行者服装，酷刑工具，10GP;或（B）50GP</P>
