<H1 align=center>第一章：<BR>族裔与特质 Heritages &amp; Traits</H1>
<P>人类主宰着艾弗瑞斯的世界。那些被称为远古诸族的生灵——龙裔、矮人、精灵、侏儒和半身人——要么散居于人类领土各处，要么在拓荒纪元的征服战争后，退守至其保留下来的孤立国度之中。虽然上述族裔代表了这世上最常见的族群，但鬼魅幽谷战役设定集提供了更广阔的族裔选项来供你构筑角色——通过这套独特的角色创建系统，你在鬼魅幽谷战役中的人物将真正独一无二。
