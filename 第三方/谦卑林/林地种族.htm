<H2>林地种族 Races of the Wood</H2>
<P>组成谦卑林世界的各族裔分为两类：鸟族和地族。尽管它们很像动物，但这些居住在谦卑林的城市和乡镇的族裔都属于类人生物。<BR>本章概述了10个核心种族，5个鸟族和5个地族，他们构成了在森林中发现的大多数角色。本章还详细介绍了各种角色创建选项、新职业选项、背景、专长和法术，以帮助您制作自己的谦卑林冒险家。</P></body>
