<H3>血仆 Ghoul</H3>
<P><STRONG>属性值：</STRONG>力量、敏捷、魅力<BR><STRONG>专长：</STRONG>夜行<BR><STRONG>技能熟练：</STRONG>察觉和求生<BR><STRONG>工具熟练：</STRONG>选择一种工匠工具<BR><STRONG>装备：</STRONG>选择A或B：(A)工匠工具（同上所选）、匕首、<EM><U>血族绯血Kindred 
Vitae</U></EM>、附盖提灯、短弓、20支箭、旅行服装、10GP；或(B)50GP。</P>
<P>在知晓血族和那片黑暗世界以后，它们将你拉入深渊。出于某种缘故，你甚至喝下了血族的血液，这血液让你充满了不洁的活力，赐予你超凡的力量、速度和寿命。但这份力量也伴随着风险：绝不能三次从同一位血族身上饮血，否则你将发现自己受缚于一位不死的主人。</P>
