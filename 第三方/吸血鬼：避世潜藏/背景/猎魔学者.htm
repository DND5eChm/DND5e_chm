<H3>猎魔学者 Scholar of the Hunt</H3>
<P><STRONG>属性值：</STRONG>体质、智力、感知<BR><STRONG>专长：</STRONG>博学<BR><STRONG>技能熟练：</STRONG>奥秘和调查<BR><STRONG>工具熟练：</STRONG>选择一种赌具<BR><STRONG>装备：</STRONG>选择A或B：(A)赌具（同上所选）、镣铐、镜子、旅行服装、15GP；或(B)50GP。</P>
<P>你曾长期研究超自然事物，通过怪物猎人的典籍与传说了解它们的危险与本质。与猎人相处的经历很可能影响了你对血族和其他夜间作祟之物的看法。</P>
