<H3>触石 Touchstone</H3>
<P><STRONG>属性值：</STRONG>体质、智力、魅力<BR><STRONG>专长：</STRONG>受护<BR><STRONG>技能熟练：</STRONG>游说和求生<BR><STRONG>工具熟练：</STRONG>选择一种工匠工具<BR><STRONG>装备：</STRONG>选择A或B：(A)工匠工具（同上所选）、旅行服装、16GP；或(B)50GP。</P>
<P>你对某位血族至关重要，这种关系或许向来如此。长久以来，一位永生者一直在暗中守护着你。你充当着它的情感纽带，提醒它仍有重要之人活在凡世，从而使这位血族得以维持道德根基、抵御心兽的侵蚀。你并非主动闯入血族的世界，而是被引导至此。</P>
