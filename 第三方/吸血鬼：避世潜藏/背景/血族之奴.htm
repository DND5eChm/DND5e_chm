<H3>血族之奴 Thrall</H3>
<P><STRONG>属性值：</STRONG>体质、感知、魅力<BR><STRONG>专长：</STRONG>康健<BR><STRONG>技能熟练：</STRONG>运动和医药<BR><STRONG>工具熟练：</STRONG>选择一种赌具或乐器<BR><STRONG>装备：</STRONG>选择A或B：(A)赌具或乐器（同上所选）、医疗包、牛眼提灯、旅行服装、32GP；或(B)50GP。</P>
<P>你对血族了如指掌，因为你是他们的仆从与现成的食物来源。你或许曾是一位自愿的供血者，向血族敞开血管，以换取与永生互动的快感，或希望自己也能获得永生。又或者，你是一个因恐惧而屈服，并遭到血族奴役与迷惑的受害者。无论过程如何，你清楚血族饥饿的代价与根源，以及如何满足它。</P>
