<body><H2>其他卓姆住民 Other Denizens of Droaam</H2>
<P>除了本节中展示的种族外，卓姆还存在其他可以套用现有机制的常见住民。<BR>卓姆的<STRONG>地精</STRONG>采用《魔邓肯巨献：多元宇宙的怪物》中提供的特质。<BR>该地区的<STRONG>狗头人</STRONG>采用《魔邓肯巨献：多元宇宙的怪物》中提供的特质。灰墙山脉的卡尔帕珥狗头人通常选择龙术遗赠；而分布在更广阔荒原里的狗头人，则更倾向于将逆反或机智作为其狗头人遗赠。<BR>图拉克巴之拳堡的<STRONG>牛头人</STRONG>采用《魔邓肯巨献：多元宇宙的怪物》中提供的特质。</P>
