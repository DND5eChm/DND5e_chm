<H3>龙纹遗脉 Dragonmarked Foundling</H3>
<P><STRONG>属性值：</STRONG>敏捷，体质，魅力<BR><STRONG>专长：</STRONG>任意龙纹专长<BR><STRONG>技能熟练：</STRONG>洞悉，隐匿<BR><STRONG>工具熟练：</STRONG>盗贼工具<BR><STRONG>装备：</STRONG>选择A或B：（A）两把匕首，盗贼工具，两个小包，旅行服装，18GP；或（B）50GP</P>
<P>你身负龙纹，却并非出生于各家族之中。你或许知晓家族的往事，明白祖先为何离家出走——又或许，当龙纹在你身上显现时，连你自己都大吃一惊。无论内情如何，你对加入那些冷酷的家族公会毫无兴趣。你会选择隐藏龙纹以避开各大家族的耳目？还是会骄傲地施展这份力量，准备将来者不善的家族密探悉数击退？<BR>  </P></body>
