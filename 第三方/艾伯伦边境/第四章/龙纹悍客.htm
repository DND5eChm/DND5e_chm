<H3>龙纹悍客 Dragonmarked Bravo</H3>
<P><STRONG>属性值：</STRONG>力量，敏捷，魅力<BR><STRONG>专长：</STRONG>任意龙纹专长<BR><STRONG>技能熟练：</STRONG>运动，威吓<BR><STRONG>工具熟练：</STRONG>如龙纹背景表所示<BR><STRONG>装备：</STRONG>选择A或B：（A）矛，轻弩，20支弩矢，箭袋，旅行服装，龙纹印戒，如龙纹背景表所示工具，12GP；或（B）50GP</P>
<P>你凭借自身的力量与敏捷为家族效命。你曾是终末战争中厮杀的佣兵？是守护家族资产与利益的护卫？还是在仓库中搬运板条箱的劳工？作为一名龙纹后裔，你与家族关系依然融洽，但你发现，相较于墨守家族公会的繁文缛节，冒险者那无拘无束的生涯才真正令你心驰神往。<BR></P></body>
