<H3>龙纹后嗣 Dragonmarked Scion</H3>
<P><STRONG>属性值：</STRONG>智力，感知，魅力<BR><STRONG>专长：</STRONG>任意龙纹专长<BR><STRONG>技能熟练：</STRONG>奥秘，游说<BR><STRONG>工具熟练：</STRONG>如龙纹背景表所示<BR><STRONG>装备：</STRONG>选择A或B：（A）长棍，高档服装，龙纹印戒，如龙纹背景表所示工具，24 GP；或（B）50GP</P>
<P>你生于龙纹家族，受训运用自己的学识与才智为家族效力。你可能曾从事行销、致力于研发，甚至担任过工程师或行政人员。你仍是龙纹后裔，只要你愿意，家族中永远有你的一席之地；但现在的你，只想去家族飞地高墙之外的世界打拼，寻求属于自己的财富与挑战。<BR>  </P></body>
