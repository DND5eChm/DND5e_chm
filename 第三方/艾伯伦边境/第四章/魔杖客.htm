<H3> 魔杖客 Wandslinger</H3>
<P><STRONG>属性值：</STRONG>敏捷，智力，魅力<BR><STRONG>专长：</STRONG> 
魔法学徒（法师）<BR><STRONG>技能熟练：</STRONG>威吓，巧手<BR><STRONG>工具熟练：</STRONG>选择一种赌具或木雕工具<BR><STRONG>装备：</STRONG>选择A或B：（A）奥术法器，赌具，两个小包，旅行服装，16GP；或（B）50GP</P>
<P>刀弓已成过去，魔法才是未来。任何有本事的战士，都得懂得如何施展戏法。你使起魔杖来得心应手，施展简单的法术也毫不含糊。你曾参加过终末战争吗？你是走私犯，还是黑道打手？无论你过去做过什么，你都知道：在这世上，只要手够稳、打得准，就永远不愁没有机会。</P></body>
