<p>本章介绍了十五个适合西部边境冒险者的新专长。其中一些专长与特定种族相关，比如美杜莎的石之瞳或鸟妖的歌影之赐（译注：没有这个专长）。而其他专长则对任何人都有用，比如魔杖客战斗风格专长。</p>
