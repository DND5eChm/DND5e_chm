<H2>子职 Subclasses</H2>
<P>在3级时，每个职业都会提供一个决定角色特质的选择，即所谓的子职，其会在特定等级赋予你相应的特性。子职会改变该职业的游玩方式，并进一步将每个职业细分为一系列截然不同的流派范式。例如，所有德鲁伊都能引导自然之力，但唯有城市结社会从都市景观中汲取力量。<BR>本节为铳士、吟游诗人、牧师、德鲁伊、游侠、术士和法师提供了七个全新的子职。</P>
