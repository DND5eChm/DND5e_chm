<H4>汲能术｜Enervation</H4>
<P><EM>五环 死灵（术士、魔契师、法师）</EM><BR><B>施法时间：</B>动作 <BR><B>施法距离：</B>60尺 <BR><B>法术成分：</B>V、S <BR><B>持续时间：</B>专注，至多1分钟<BR>一条漆黑如墨的触须从你身上延伸，汲取施法距离内你可见的一个生物的生命。<BR>目标进行一次敏捷豁免。豁免失败则目标受6d8暗蚀伤害。你在此后每个你的回合中都可以再用附赠动作对目标自动造成2d8暗蚀伤害。法术会在目标超出法术的施法距离或对你具有全掩护时结束。<BR>若豁免成功，则目标仅受半伤，且法术结束。<BR>每当该法术对目标造成伤害时，你都可以恢复等于其造成的暗蚀伤害一半的生命值。<BR><STRONG>升环施法。</STRONG>你使用的法术位每比五环高一环，初始伤害便增加1d8。</P>
