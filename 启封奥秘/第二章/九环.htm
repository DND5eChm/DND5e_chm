<H4>爆破术｜Detonate</H4>
<P><EM>九环 
塑能（术士、魔契师、法师）<BR></EM><B>施法时间：</B>动作 <BR><B>施法距离：</B>500尺 <BR><B>法术成分：</B>V、S、M（一枚火种） 
<BR>
<B>
持续时间：
</B>立即
<BR>你在施法距离内一名你可见的生物体内制造一颗魔法性的爆裂之种。目标进行一次体质豁免，豁免失败则受10d10火焰伤害，豁免成功则伤害减半。
<BR >
  随后目标处将发生一次爆炸。位于源自目标的60尺光环区域内的所有生物（不包含目标）都进行一次敏捷豁免（若该法术已将目标生命值降为0则具有劣势）。豁免失败者受到10d10火焰伤害，豁免成功则伤害减半。
<BR >
 该光环区域内未被携带或着装的非魔法物件也要承受该伤害，且可燃物件将开始燃烧。 
</P>
