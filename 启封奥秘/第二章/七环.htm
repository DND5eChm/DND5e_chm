<H4>闪避灵光｜Aura of Evasion</H4>
<P><EM>七环 防护（术士、魔契师、法师）</EM> 
<BR><B>施法时间：</B>动作 <BR><B>施法距离：</B>自身 <BR><B>法术成分：</B>V、S <BR><B>持续时间：</B>专注，至多1分钟<BR>迅捷的灵光在持续时间内环绕着源自你的30尺光环区域。你和你的盟友在位于该光环内期间进行敏捷豁免时具有优势。当一名受影响的生物受到一个允许其进行敏捷豁免来只承受一半伤害的效应影响时，其在豁免成功时不受伤害，豁免失败时只承受一半伤害。陷入失能状态的生物无法从该灵光中获得任何增益。 
</P>
