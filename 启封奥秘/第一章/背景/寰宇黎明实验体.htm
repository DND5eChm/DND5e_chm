<H2>寰宇黎明实验体 Cosmic Dawn Experiment</H2>
<P><b>属性值：</b>力量、敏捷、体质
<BR><b>专长：</b>万化本质
<BR><b>技能熟练：</b>运动和求生
<BR><b>工具熟练：</b>选择一种工匠工具
<BR><b>装备：</b>选择A或B：（A）工匠工具（与上述相同）、背包、长袍、旅行服装、30GP；或（B）50GP</P>
<P>你的躯体因寰宇黎明使徒会的变化系魔法实践而发生了扭曲。也许你是意外被卷入了该组织的某场实验，又或者你本就是其中的一员，妄图借助魔法伟力来升华自己的物理形态。无论情况如何，你都能将这奇异的躯体化作自己的优势。</P>
