<H2>先知学徒 Seer Apprentice</H2>
<P><b>属性值：</b>智力、感知、魅力
<BR><b>专长：</b>奥法预言家
<BR><b>技能熟练：</b>历史和洞悉
<BR><b>工具熟练：</b>领航工具
<BR><b>装备：</b>选择A或B：（A）领航工具、8根蜡烛、墨水、墨水笔、羊皮纸（9张）、小包、火绒盒、旅行服装、11GP；或（B）50GP</P>
<P>作为沧穹先知会中的一名学徒，你学会了解读天穹云层与幽深沧海中蕴含的微小预兆。该组织庞大的图书馆网络进一步拓展了你的学识，如今你周游世界，为他人提供指引与援助。</P>
