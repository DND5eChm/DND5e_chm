<H2>魔宠训练家 Familiar Trainer</H2>
<P><b>属性值：</b>体质、智力、感知
<BR><b>专长：</b>魔宠密友
<BR><b>技能熟练：</b>驯兽和奥秘
<BR><b>工具熟练：</b>选择一种赌具
<BR><b>装备：</b>选择A或B：（A）长棍、赌具（与上述相同）、铺盖、铃铛、细线、火绒盒、旅行服装、水袋、44GP；或（B）50GP</P>
<P>一只魔法宠物在你年幼时与你结下羁绊，陪伴你度过整个青春岁月。如今，你已经无法想象没有这个毛茸茸——或羽翼丰满、鳞甲覆盖、黏滑湿润——的朋友陪伴的生活。你学会了与你的魔宠协同行动，而当冒险带来挑战时，你的伙伴总会提醒你留意生活中的那些小确幸。</P>
