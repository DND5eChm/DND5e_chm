<H2>庇护之手受护者 Ward of the Sheltering Hands</H2>
<P><b>属性值：</b>体质、感知、魅力
<BR><b>专长：</b>奥法护佑者
<BR><b>技能熟练：</b>洞悉和医药
<BR><b>工具熟练：</b>厨师工具
<BR><b>装备：</b>选择A或B：（A）厨师工具、毯子、医疗包、油灯、燃油（3扁瓶）、火绒盒、旅行服装、水袋、40GP；或（B）50GP</P>
<P>命运的一次转折将你带到了庇护之手——一个致力于保护弱势群体的无私组织。该组织帮助你重新站稳脚跟，并传授了你一些防护魔法，希望有一天，你也能在那些不幸之人需要帮助时，为他们提供庇护。</P>
