<H2>亡陵誓盟新晋者 Covenant of the Grave Recruit</H2>
<P><b>属性值：</b>力量、智力、感知
<BR><b>专长：</b>奥法殡葬师
<BR><b>技能熟练：</b>历史和医药
<BR><b>工具熟练：</b>草药工具
<BR><b>装备：</b>选择A或B：（A）匕首、草药工具、书籍（解剖学）、铁锹、16GP；或（B）50GP</P>
<P>死亡始终令你深深着迷。你曾与亡陵誓盟的成员们一道钻研这一阴郁的课题，以科学般的严谨态度去剖析那些可怖之物。借由这些研究，你积累了丰富的药物学、死灵术以及历史学识。</P>
