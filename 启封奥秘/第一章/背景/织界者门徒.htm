<H2>织界者门徒 Horizon Weaver Initiate</H2>
<P><b>属性值：</b>敏捷、体质、感知
<BR><b>专长：</b>穿界者
<BR><b>技能熟练：</b>特技和生存
<BR><b>工具熟练：</b>织布工具
<BR><b>装备：</b>选择A或B：（A）短弓、20支箭、织布工具、地图、箭袋、绳索、旅行服装、18GP；或（B）50GP</P>
<P>难以抑制的远行渴望，是你青春期最鲜明的特点。只要能力所及，你便离开家乡踏上旅途。在旅途中，你遇到了织界者中那些富有冒险精神的咒法师，他们传授了你部分传送魔法，使你的探索之路能够延伸得更远。</P>
