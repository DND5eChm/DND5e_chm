<H2>瑰宝秘社间谍 Bejeweled Conclave Spy</H2>
<P><b>属性值：</b>敏捷、感知、魅力
<BR><b>专长：</b>奥法雄辩家
<BR><b>技能熟练：</b>欺瞒和察觉
<BR><b>工具熟练：</b>易容工具
<BR><b>装备：</b>选择A或B：（A）易容工具、高档服装、香水、5GP；或（B）50GP</P>
<P>在公开场合，你是一名朝臣、调停者或艺人。然而，在那光鲜亮丽的外表之下，却隐藏着一颗专为刺探秘密而千锤百炼出的敏锐心智。经过瑰宝秘社惑控师们的训练，你深谙如何运用自身的魅力与机智，再加上一点小小的魔法，来渗透组织、发掘情报以及促成交易。</P>
