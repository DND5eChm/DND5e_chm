<H2>第九翎羽特工 Agent of the Ninth Quill</H2>
<P><b>属性值：</b>敏捷、智力、魅力
<BR><b>专长：</b>奥法渗透者
<BR><b>技能熟练：</b>奥秘和巧手
<BR><b>工具熟练：</b>盗贼工具
<BR><b>装备：</b>选择A或B：（A）匕首、轻锤、盗贼工具、铁钉、绳索、旅行服装、17GP；或（B）50GP</P>
<P>你敏锐的头脑和高超的盗窃技巧，让你结识并加入了第九翎羽——一个由盗贼、破坏者和间谍组成的团体，专门从他人手中窃取魔法学识与圣物。在你的冒险生涯中——从盗取魔法物品和奥术典籍，到破坏法师团体的行动——你磨砺出了狡诈的技巧与魔法戏法，从而让你的谍报手腕更进一步。</P>
