<P><STRONG><FONT color=#800000 size=5>漆黑之土的邪教徒 Black Earth Cultists</FONT></STRONG></P>
<P>杀手、疯子、满怀仇恨的虚无主义者——这类人正是被元素邪恶之力所吸引对其崇拜之人。邪恶土元素的追随者自称漆黑之土，并幻想着有朝一日地震会将凡人世界化为废墟。他们设法招募那些会掘穴或栖息在地下的邪恶或具破坏性的怪物，事实上，他们还会尽可能地模仿地下生物，借助掘地魔法开辟出隐秘的巢穴。<BR>漆黑之土邪教徒行动迟缓，但一旦采取行动，便会不可动摇。他们心思专一且固执，不知疲倦地暗中削弱敌人。他们与摧压之浪教派相处融洽，却憎恨呼嚎之恨教派——与土元素的力量相比，气元素无常又虚幻缥缈。</P></body>
