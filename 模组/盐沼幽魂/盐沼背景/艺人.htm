<H2>艺人 Entertainer</H2>
<P>吟游诗人和表演者在盐沼总是很受欢迎。你可以使用你的人见人爱特性在柳条羊酒馆或钓线酒馆找一份工作。柳条羊酒馆很受城镇守卫和在镇外的矿坑工作的矮人的欢迎，而钓线酒馆是渔民，水手和码头工人经常光顾的地方。从中选择一个酒馆作为你的首选地点，在那里的工作人员、老板和常客会把你当做朋友。</P>
