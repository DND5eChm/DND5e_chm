<H2>士兵 Soldier</H2>
<P>科奥兰的许多退役士兵都在南部地区安家，你也不例外。你还可能在镇上做过一段时间的守卫。不管你是否这样做，你在他们的部队中有几个朋友。守卫队长埃利安德·火诞对老兵很友好，如果有紧急需要，他原意抽出时间和你会面。作为你的选择，你也可以在城外拥有一小块土地和一个农场。</P>
