<H2>流浪儿 Urchin</H2>
<P>小时候，你因为海上的悲剧失去了单亲或双亲。后来，你靠着别人的施舍长大。最重要的是，你在街上讨生活这这些年学会了潜行，偷听和过目不忘的本领来保守秘密。选择盐沼城镇议会的一名议员，DM会给你一个关于那个人的秘密，或者让你选择创造一个你喜欢的细节来描述你曾为他们帮过忙、使其欠你恩情的具体细节。例如，你无意中听到了窃贼正计划从格兰·伟水偷东西。</P>
