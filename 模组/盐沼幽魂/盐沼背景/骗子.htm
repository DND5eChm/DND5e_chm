<H2>骗子 Charlatan</H2>
<P>随着盐沼的发展壮大，这地方对像你这样的骗子更具吸引力了。如果你在镇上做生意，你会和温斯顿Winston（温斯顿商店的老板）打交道。半身人商人总是在寻找新的商品加入自己的供货。他很了解盐沼人，并会教你如何在不惹怒当地人的前提下赚钱。</P>
