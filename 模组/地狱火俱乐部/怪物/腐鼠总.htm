<H1>腐鼠 Corrupted Rat
</H1>

<p class=sum>受魔法腐化的潜行害兽</FONT>
</p>

<P>埃姆夏尔Elmshire的老鼠因某位坏心肠的前冒险者的魔法而被腐化，显得毛色斑驳而病态。它们那结痂的毛皮之下，器官发光且起泡，仿佛准备要炸裂一般。这些害兽有时会汇聚成吱吱叫的浪潮，并吞食它们道路上的一切东西。
</P>
