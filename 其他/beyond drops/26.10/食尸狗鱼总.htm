<H1>食尸狗鱼 Sarcopike
</H1>

<p class=sum>幽暗水岸的噬肉祸害
</p>

<div class="HT"><STRONG>栖息地：</STRONG>
海岸，水下；<STRONG>宝藏：</STRONG>无
</div>

<P>食尸狗鱼是一种游弋于堕影冥界淡水溪流、池塘与湖泊中的鱼形生物。它们能够利用强健的鳍肢在陆地上行走，以寻找食物。不过它们终究必须返回水中才能呼吸。
<BR>在堕影冥界与物质位面之间屏障薄弱的区域，成群的食尸狗鱼（俗称尸鱼团Sarcopile）可能会跨越位面侵入，袭扰当地居民。这些鱼群会潜伏于毗邻墓地、战场或其他存在大量新鲜尸体的水源中，将那里作为自己的猎食之地。

</P>
