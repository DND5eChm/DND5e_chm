name: Build and Publish 5echm Web

on:
  push:
    branches:
      - main

  workflow_dispatch:

# 不允许两个发布任务同时修改目标仓库。
# 也不取消已经开始的发布，避免两个目标仓库只更新了一半。
concurrency:
  group: 5echm-web-publish
  cancel-in-progress: false

# 当前 DND5e_chm 仓库只需要读取权限。
# 两个跨仓库发布目标使用 WEB_PUBLISH_TOKEN。
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

  SEARCH_API_BASE: "https://5echmsearch.kagangtuya.top"

  SITE_REPOSITORY: "DND5eChm/5echm_web"
  SITE_BRANCH: "pages"

  SEARCH_REPOSITORY: "DND5eChm/5echmweb_search"
  SEARCH_BRANCH: "main"

jobs:
  build-and-publish:
    name: Build and publish web
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # ============================================================
      # 1. DND5e_chm
      #
      # push:
      #   构建触发本次 Action 的准确 commit。
      #
      # workflow_dispatch:
      #   固定构建 main。
      # ============================================================

      - name: Checkout DND5e_chm
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.sha }}
          path: content
          fetch-depth: 1
          persist-credentials: false

      # ============================================================
      # 2. Web 编译器
      # ============================================================

      - name: Checkout web compiler
        uses: actions/checkout@v6
        with:
          repository: DND5eChm/5echm_web_build
          ref: main
          path: compiler
          fetch-depth: 1
          persist-credentials: false

      # ============================================================
      # 3. Web 模板
      #
      # 注意：
      # 这里虽然模板仓库也有 webhelpsearch.htm，
      # 但最终搜索页不会使用它。
      #
      # 后面的 search_template 会明确指定：
      # publish-search/webhelpsearch.htm
      # ============================================================

      - name: Checkout web templates
        uses: actions/checkout@v6
        with:
          repository: DND5eChm/5echm_web_templates
          ref: main
          path: templates
          fetch-depth: 1
          persist-credentials: false

      # ============================================================
      # 4. 检查发布 Token
      # ============================================================

      - name: Verify publish token
        shell: bash
        env:
          WEB_PUBLISH_TOKEN: ${{ secrets.WEB_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${WEB_PUBLISH_TOKEN:-}" ]; then
            echo "::error::Repository secret WEB_PUBLISH_TOKEN is not configured."
            exit 1
          fi

      # ============================================================
      # 5. 5echm_web:pages
      #
      # 使用 PAT 是因为后面需要跨仓库 push。
      # ============================================================

      - name: Checkout site repository
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SITE_REPOSITORY }}
          ref: ${{ env.SITE_BRANCH }}
          path: publish-site
          fetch-depth: 1
          token: ${{ secrets.WEB_PUBLISH_TOKEN }}
          persist-credentials: true

      # ============================================================
      # 6. 5echmweb_search:main
      #
      # 它有两个用途：
      #
      # 1. 提供最新版 webhelpsearch.htm
      # 2. 接收新的 data.js / data.js.zip
      # ============================================================

      - name: Checkout search repository
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SEARCH_REPOSITORY }}
          ref: ${{ env.SEARCH_BRANCH }}
          path: publish-search
          fetch-depth: 1
          token: ${{ secrets.WEB_PUBLISH_TOKEN }}
          persist-credentials: true

      # ============================================================
      # 7. Python
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: compiler/pyproject.toml

      # ============================================================
      # 8. 安装 wcp2web
      # ============================================================

      - name: Install web compiler
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install ./compiler

          echo "Python:"
          python --version

          echo "wcp2web:"
          wcp2web --help >/dev/null

      # ============================================================
      # 9. 检查构建输入
      # ============================================================

      - name: Verify build inputs
        shell: bash
        run: |
          set -euo pipefail

          test -f "content/不全书.wcp"
          test -d "templates"
          test -f "publish-search/webhelpsearch.htm"

          echo "Content WCP:"
          ls -lh "content/不全书.wcp"

          echo "Search template:"
          ls -lh "publish-search/webhelpsearch.htm"

      # ============================================================
      # 10. 准备最新版搜索模板
      #
      # source:
      #   5echmweb_search:main/webhelpsearch.htm
      #
      # 当前搜索仓库里的文件仍可能写：
      #
      #   var API_BASE="http://localhost:13000"
      #
      # 而 wcp2web 的模板变量是：
      #
      #   ($SEARCH_API_BASE$)
      #
      # 因此临时将 API_BASE 的赋值改成模板变量。
      #
      # 如果以后搜索仓库本身已经改成模板变量，
      # 这里会直接保持原样。
      #
      # 注意：
      # 这里只临时修改 Actions checkout，
      # 后面会 git restore，不会把修改后的
      # webhelpsearch.htm 提交回搜索仓库。
      # ============================================================

      - name: Prepare search template
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("publish-search/webhelpsearch.htm")
          text = path.read_text(encoding="utf-8-sig")

          placeholder = "($SEARCH_API_BASE$)"

          if placeholder in text:
              print("Search template already uses SEARCH_API_BASE placeholder.")
          else:
              pattern = re.compile(
                  r'(?m)^'
                  r'(\s*(?:var|let|const)\s+API_BASE\s*=\s*)'
                  r'(["\'])'
                  r'.*?'
                  r'\2'
                  r'\s*;?'
                  r'\s*$'
              )

              replacement = r'\1"' + placeholder + '"'

              text, count = pattern.subn(
                  replacement,
                  text,
                  count=1,
              )

              if count != 1:
                  raise SystemExit(
                      "Could not find exactly one API_BASE assignment "
                      "in 5echmweb_search/webhelpsearch.htm"
                  )

              path.write_text(
                  text,
                  encoding="utf-8",
                  newline="",
              )

              print(
                  "Temporarily replaced API_BASE with "
                  "SEARCH_API_BASE placeholder."
              )

          # 最终检查
          result = path.read_text(encoding="utf-8")

          if placeholder not in result:
              raise SystemExit(
                  "SEARCH_API_BASE placeholder is missing."
              )
          PY

      # ============================================================
      # 11. 创建构建配置
      #
      # 所有路径相对于：
      #
      #   build-config/wcp2web.toml
      #
      # search_template 明确指向：
      #
      #   5echmweb_search:main/webhelpsearch.htm
      #
      # 因此不会使用 templates 中的旧搜索页。
      # ============================================================

      - name: Generate wcp2web config
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build-config
          mkdir -p output

          cat > build-config/wcp2web.toml <<'TOML'
          [project]
          wcp = "../content/不全书.wcp"
          source_root = "../content"
          template_root = "../templates"
          title = "5E 不全书"

          [output]
          site_dir = "../output/site"
          search_data = "../output/search/data.js"
          report_dir = "../output/reports"

          [webhelp]
          search_api_base = "https://5echmsearch.kagangtuya.top"
          search_template = "../publish-search/webhelpsearch.htm"
          default_page = ""
          nav_width = 285
          back_color = "#ffffff"

          [encoding]
          default_fallback = "gb18030"
          strict = false

          [build]
          jobs = 4
          incremental = false
          clean = true
          TOML

          echo "===== wcp2web.toml ====="
          cat build-config/wcp2web.toml

      # ============================================================
      # 12. Web 编译
      # ============================================================

      - name: Build web site
        shell: bash
        run: |
          set -euo pipefail

          wcp2web build \
            --config build-config/wcp2web.toml

          test -d output/site
          test -s output/site/index.html
          test -s output/site/webhelpsearch.htm
          test -s output/search/data.js

          echo "===== Build completed ====="

          du -sh output/site
          ls -lh output/search/data.js

      # ============================================================
      # 13. 验证搜索页
      #
      # 必须满足：
      #
      # 1. 使用正式 API
      # 2. 不再包含 localhost:13000
      # 3. 不留下 SEARCH_API_BASE 模板变量
      # ============================================================

      - name: Verify compiled search page
        shell: bash
        run: |
          set -euo pipefail

          SEARCH_PAGE="output/site/webhelpsearch.htm"

          if ! grep -Fq \
            "${SEARCH_API_BASE}" \
            "${SEARCH_PAGE}"
          then
            echo "::error::Compiled webhelpsearch.htm does not contain the production API URL."
            exit 1
          fi

          if grep -Fq \
            "http://localhost:13000" \
            "${SEARCH_PAGE}"
          then
            echo "::error::Compiled webhelpsearch.htm still contains localhost API."
            exit 1
          fi

          if grep -Fq \
            '($SEARCH_API_BASE$)' \
            "${SEARCH_PAGE}"
          then
            echo "::error::SEARCH_API_BASE placeholder was not rendered."
            exit 1
          fi

          echo "Search API verified:"
          grep -F "${SEARCH_API_BASE}" "${SEARCH_PAGE}" | head -n 3

      # ============================================================
      # 14. 移除站点版 data.js
      #
      # wcp2web 当前会自动创建：
      #
      #   output/site/data.js
      #
      # 但是现在 Web 搜索使用后端 API，
      # data.js 只应存在于 5echmweb_search。
      #
      # 因此在发布站点之前删除。
      # ============================================================

      - name: Remove search data from site output
        shell: bash
        run: |
          set -euo pipefail

          rm -f \
            output/site/data.js \
            output/site/data.js.zip

          if [ -e output/site/data.js ]; then
            echo "::error::output/site/data.js still exists."
            exit 1
          fi

          echo "Search data removed from site output."

      # ============================================================
      # 15. 恢复搜索仓库中的 webhelpsearch.htm
      #
      # Prepare search template 的修改仅用于编译，
      # 不能提交回 5echmweb_search。
      # ============================================================

      - name: Restore search repository template
        shell: bash
        run: |
          set -euo pipefail

          git -C publish-search restore -- webhelpsearch.htm

          if ! git -C publish-search diff --quiet -- webhelpsearch.htm; then
            echo "::error::webhelpsearch.htm was not restored."
            exit 1
          fi

      # ============================================================
      # 16. data.js -> data.js.zip
      #
      # 生成：
      #
      #   output/search/data.js
      #   output/search/data.js.zip
      #
      # ZIP 内只有：
      #
      #   data.js
      #
      # 同时固定 ZIP 时间戳，避免仅因为构建时间变化
      # 导致压缩包产生无意义 diff。
      # ============================================================

      - name: Create data.js ZIP
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile, ZipInfo

          source = Path("output/search/data.js")
          archive = Path("output/search/data.js.zip")

          if not source.is_file():
              raise SystemExit(
                  "output/search/data.js does not exist"
              )

          data = source.read_bytes()

          info = ZipInfo(
              filename="data.js",
              date_time=(1980, 1, 1, 0, 0, 0),
          )

          info.compress_type = ZIP_DEFLATED
          info.create_system = 3
          info.external_attr = 0o100644 << 16

          with ZipFile(
              archive,
              mode="w",
              compression=ZIP_DEFLATED,
              compresslevel=9,
          ) as zf:
              zf.writestr(
                  info,
                  data,
                  compress_type=ZIP_DEFLATED,
                  compresslevel=9,
              )

          # 验证 ZIP
          with ZipFile(archive, mode="r") as zf:
              bad_file = zf.testzip()

              if bad_file is not None:
                  raise SystemExit(
                      f"Corrupted ZIP member: {bad_file}"
                  )

              if zf.namelist() != ["data.js"]:
                  raise SystemExit(
                      f"Unexpected ZIP contents: {zf.namelist()}"
                  )

              if zf.read("data.js") != data:
                  raise SystemExit(
                      "ZIP data.js does not match source."
                  )

          print(
              f"data.js:     {source.stat().st_size:,} bytes"
          )
          print(
              f"data.js.zip: {archive.stat().st_size:,} bytes"
          )
          PY

          test -s output/search/data.js
          test -s output/search/data.js.zip

          echo "===== Search output ====="
          ls -lh \
            output/search/data.js \
            output/search/data.js.zip

      # ============================================================
      # 17. 同步 output/site/ -> 5echm_web:pages
      #
      # output/site/ 尾部的 "/" 表示：
      #
      #   将 site 里面的内容复制到 pages 根目录
      #
      # 不会创建：
      #
      #   pages/site/
      #   pages/output/
      #
      # 不使用 --delete：
      #
      #   - 同名文件覆盖
      #   - 新文件增加
      #   - 旧文件不会因为本次构建不存在而被删除
      #
      # 唯一主动删除的是 data.js/data.js.zip。
      # ============================================================

      - name: Sync site output
        shell: bash
        run: |
          set -euo pipefail

          rsync \
            -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='CNAME' \
            --exclude='README.md' \
            --exclude='data.js' \
            --exclude='data.js.zip' \
            output/site/ \
            publish-site/

          # 清除以前已经提交过的搜索索引文件。
          # 这会让第一次运行 Action 时把 pages/data.js
          # 从 Git 历史的当前版本中删除。
          rm -f \
            publish-site/data.js \
            publish-site/data.js.zip

          echo "===== Site repository changes ====="
          git -C publish-site status --short

      # ============================================================
      # 18. 最终检查网页仓库
      #
      # 根目录绝对不能包含 data.js / data.js.zip。
      # ============================================================

      - name: Verify site publish tree
        shell: bash
        run: |
          set -euo pipefail

          test -s publish-site/index.html
          test -s publish-site/webhelpsearch.htm

          if [ -e publish-site/data.js ]; then
            echo "::error::publish-site/data.js must not exist."
            exit 1
          fi

          if [ -e publish-site/data.js.zip ]; then
            echo "::error::publish-site/data.js.zip must not exist."
            exit 1
          fi

          if ! grep -Fq \
            "${SEARCH_API_BASE}" \
            publish-site/webhelpsearch.htm
          then
            echo "::error::Published webhelpsearch.htm has wrong API URL."
            exit 1
          fi

          echo "Site publish tree verified."

      # ============================================================
      # 19. 同步搜索数据
      #
      # 只更新搜索仓库：
      #
      #   data.js
      #   data.js.zip
      #
      # 不更新 webhelpsearch.htm。
      # ============================================================

      - name: Sync search data
        shell: bash
        run: |
          set -euo pipefail

          cp \
            output/search/data.js \
            publish-search/data.js

          cp \
            output/search/data.js.zip \
            publish-search/data.js.zip

          echo "===== Search repository changes ====="
          git -C publish-search status --short

      # ============================================================
      # 20. 检查搜索仓库不会误提交其他文件
      # ============================================================

      - name: Verify search repository changes
        shell: bash
        run: |
          set -euo pipefail

          # webhelpsearch.htm 必须保持仓库原版
          if ! git -C publish-search diff --quiet -- webhelpsearch.htm; then
            echo "::error::webhelpsearch.htm must not be modified in search repository."
            exit 1
          fi

          echo "Search repository verified."

      # ============================================================
      # 21. 先发布搜索数据
      #
      # 先更新搜索后端使用的数据，
      # 再更新前端站点。
      # ============================================================

      - name: Publish search data to main
        working-directory: publish-search
        shell: bash
        run: |
          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # 只允许提交这两个文件。
          git add \
            data.js \
            data.js.zip

          if git diff --cached --quiet; then
            echo "No search data changes to publish."
            exit 0
          fi

          CONTENT_SHA="$(
            git -C "$GITHUB_WORKSPACE/content" \
              rev-parse --short HEAD
          )"

          echo "Publishing search data from ${CONTENT_SHA}"

          git commit \
            -m "build: update search data from DND5e_chm@${CONTENT_SHA}"

          git push \
            origin \
            HEAD:${SEARCH_BRANCH}

      # ============================================================
      # 22. 发布 Web 到 pages
      #
      # git add -A 很重要：
      # 它会把历史遗留 pages/data.js 的删除也提交进去。
      # ============================================================

      - name: Publish site to pages
        working-directory: publish-site
        shell: bash
        run: |
          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No site changes to publish."
            exit 0
          fi

          CONTENT_SHA="$(
            git -C "$GITHUB_WORKSPACE/content" \
              rev-parse --short HEAD
          )"

          echo "Publishing site from ${CONTENT_SHA}"

          git commit \
            -m "build: publish web from DND5e_chm@${CONTENT_SHA}"

          git push \
            origin \
            HEAD:${SITE_BRANCH}

      # ============================================================
      # 23. 构建报告
      # ============================================================

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wcp2web-reports-${{ github.run_number }}
          path: output/reports/
          if-no-files-found: ignore
          retention-days: 14
