<H1>第二章：鸦阁的领域 Domains of Ravenloft</H1>
<P>在堕影冥界深不可测的边缘，坐落着恐惧领域——这些被迷雾束缚的国度，魔法与现实在此扭曲成一场场噩梦。本章面向地下城主，探索最为骇人的恐惧领域。除其他工具之外，本章介绍的每个领域均包含以下内容：<BR><STRONG>领域Domain。</STRONG>本节介绍该领域、其独有的恐怖景象以及值得注意的地点。<BR><STRONG>黑暗领主Darklord。</STRONG>本节介绍该领域的黑暗领主，包括其数据卡、其在领域内制造的种种影响、其封锁领域边境的方式（见前言），以及其巢穴的相关信息。<BR><STRONG>冒险Adventures。</STRONG>本节提供在该领域中设计冒险的指导、战役大纲以及短篇冒险。<BR>本章最后将概述其他恐惧领域。</P>
